name: Build WalletPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept licenses
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT

    - name: Set SDK path
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Run Build (capture output)
      run: |
        set +e
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.txt
        EXIT=${PIPESTATUS[0]}
        echo "BUILD_EXIT=$EXIT" >> $GITHUB_ENV
        if [ $EXIT -ne 0 ]; then
          echo "==== LAST 100 LINES OF BUILD OUTPUT ===="
          tail -100 build_output.txt
          exit $EXIT
        fi

    - name: Upload APK
      if: env.BUILD_EXIT == '0' || success()
      uses: actions/upload-artifact@v4
      with:
        name: WalletPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90

    - name: Upload Build Log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.txt
        retention-days: 7
