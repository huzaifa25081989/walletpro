name: Build WalletPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
        printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK
      run: |
        set +e
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | while IFS= read -r line; do
          echo "$line"
          if echo "$line" | grep -qiE "^.*error:|exception in|caused by:|execution failed|build failed|could not resolve|could not find|unresolved reference|cannot find symbol"; then
            echo "::error::$line"
          fi
        done
        exit ${PIPESTATUS[0]}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: WalletPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
