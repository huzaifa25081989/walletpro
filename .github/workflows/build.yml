name: Build WalletPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup SDK and build environment
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ANDROID_HOME is: $ANDROID_HOME"
        ls $ANDROID_HOME/platforms/ || echo "No platforms"
        cat app/build.gradle

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Validate project
      run: |
        echo "=== Project files ==="
        find . -name "*.java" -o -name "*.xml" -o -name "*.gradle" | grep -v ".git" | sort
        echo ""
        echo "=== AndroidManifest ==="
        cat app/src/main/AndroidManifest.xml

    - name: Build APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: WalletPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
