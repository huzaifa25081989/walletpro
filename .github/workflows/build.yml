name: Build WalletPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
        printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK (capture & post errors)
      run: |
        set +e
        ./gradlew assembleDebug 2>&1 | tee /tmp/gradle.log
        EXIT=${PIPESTATUS[0]}
        
        if [ $EXIT -ne 0 ]; then
          echo "=== GRADLE ERRORS ==="
          grep -E "error:|Error:|FAILED|Exception|Caused by:|warning:|BUILD" /tmp/gradle.log | head -50
          echo ""
          echo "=== LAST 50 LINES ==="
          tail -50 /tmp/gradle.log
          
          # Post to GitHub Gist for external reading
          CONTENT=$(cat /tmp/gradle.log | tail -200 | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/gists \
            -d "{\"public\":true,\"description\":\"WalletPro Build Log\",\"files\":{\"build.log\":{\"content\":$CONTENT}}}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('GIST:', d.get('html_url','error'))"
          
          exit $EXIT
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: WalletPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
