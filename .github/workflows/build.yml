name: Build WalletPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup environment
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK and write summary
      run: |
        set +e
        OUTPUT=$(./gradlew assembleDebug --no-daemon --stacktrace 2>&1)
        EXIT=$?
        
        # Write full output to step summary (accessible via API)
        echo "## Build Output" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "$OUTPUT" | tail -120 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Also print to console
        echo "$OUTPUT"
        exit $EXIT

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: WalletPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
