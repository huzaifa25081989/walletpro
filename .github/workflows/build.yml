name: Build WalletPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Write local.properties
      run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

    - name: Accept SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Install SDK components
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Show APK info
      run: |
        APK=$(find app/build/outputs -name "*.apk" | head -1)
        echo "APK: $APK"
        ls -lh "$APK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WalletPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
