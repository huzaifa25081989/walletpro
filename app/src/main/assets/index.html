<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WalletPro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0A0F1E;--s1:#111827;--s2:#1A2236;--s3:#212D42;--bd:#1F2D47;--tx:#F0F4FF;--mt:#64748B;--ac:#10B981;--a2:#F59E0B;--a3:#6366F1;--rd:#EF4444;--fn:'DM Sans',system-ui,sans-serif;--fd:'Syne',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--tx);font-family:var(--fn);font-size:14px}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:72px}
#content::-webkit-scrollbar{width:0}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:var(--s1);border-top:1px solid var(--bd);display:flex;z-index:60;padding:6px 0 8px}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:none;background:none;color:var(--mt);font-size:10px;font-family:var(--fn);cursor:pointer;transition:color .15s}
.ni .ico{font-size:20px;line-height:1}
.ni.active{color:var(--ac)}
#fab{position:fixed;bottom:82px;right:18px;width:52px;height:52px;border-radius:26px;background:var(--ac);border:none;color:#fff;font-size:27px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(16,185,129,.45);z-index:55;cursor:pointer}
#fab:active{transform:scale(.9)}
.card{background:var(--s1);border-radius:16px;padding:16px;border:1px solid var(--bd)}
.card2{background:var(--s2);border-radius:13px;padding:13px}
.hdr{padding:18px 16px 12px;background:var(--bg);position:sticky;top:0;z-index:40}
.hdr h1{font-family:var(--fd);font-size:22px;font-weight:800}
.stitle{font-family:var(--fd);font-size:15px;font-weight:700;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:11px 18px;border-radius:12px;border:none;font-weight:700;font-size:14px;font-family:var(--fd);cursor:pointer;transition:all .15s;white-space:nowrap}
.bp{background:var(--ac);color:#fff}.bp:active{filter:brightness(.88)}
.bd2{background:var(--rd);color:#fff}
.bo{background:transparent;border:1px solid var(--bd);color:var(--tx)}.bo:active{background:var(--s3)}
.bsm{padding:7px 12px;font-size:12px;border-radius:10px}
.bfull{width:100%;justify-content:center}
input,select,textarea{font-family:var(--fn);background:var(--s3);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 13px;width:100%;font-size:14px;outline:none;transition:border .2s;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--ac)}
select option{background:var(--s1)}
input[type=color]{padding:3px 5px;height:42px;cursor:pointer}
input[type=date]{color-scheme:dark}
.lbl{display:block;font-size:12px;color:var(--mt);margin-bottom:5px;font-weight:500}
.fg{margin-bottom:13px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ttog{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--bd);margin-bottom:13px}
.tb{flex:1;padding:10px 4px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--fd);transition:all .15s;background:var(--s2);color:var(--mt)}
.tb.ti.on{background:rgba(16,185,129,.2);color:#10B981}
.tb.te.on{background:rgba(239,68,68,.2);color:#EF4444}
.tb.tt.on{background:rgba(100,116,139,.2);color:#94A3B8}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.ci{background:rgba(16,185,129,.15);color:#10B981}
.ce{background:rgba(239,68,68,.15);color:#EF4444}
.ct{background:rgba(100,116,139,.15);color:#94A3B8}
.ascroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.ascroll::-webkit-scrollbar{display:none}
.acard{border-radius:18px;padding:18px;min-width:172px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.acard:active{transform:scale(.96)}
.txi{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.txi:active{background:var(--s2)}
.txi-ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.txi-m{flex:1;min-width:0}
.txi-n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txi-s{font-size:11px;color:var(--mt);margin-top:2px}
.txi-a{text-align:right;flex-shrink:0}
.ap{color:#10B981;font-weight:700;font-size:15px}
.an{color:#EF4444;font-weight:700;font-size:15px}
.at{color:#94A3B8;font-weight:700;font-size:15px}
.srow{display:flex;gap:10px}
.stat{background:var(--s2);border-radius:13px;padding:12px 14px;flex:1;min-width:0}
.stl{font-size:11px;color:var(--mt);margin-bottom:3px}
.stv{font-family:var(--fd);font-size:17px;font-weight:800}
.pb{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .5s ease}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fc{padding:6px 13px;border-radius:20px;border:1px solid var(--bd);font-size:12px;cursor:pointer;background:none;color:var(--mt);font-family:var(--fn);white-space:nowrap}
.fc.on{background:var(--ac);border-color:var(--ac);color:#fff}
.srch{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:9px 14px;margin-bottom:10px}
.srch input{background:none;border:none;color:var(--tx);flex:1;font-size:14px;padding:0;width:auto}
.mover{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:mfade .18s ease}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.mbox{background:var(--s1);border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:22px 20px 28px;animation:mslide .22s ease}
.mbox::-webkit-scrollbar{width:0}
@keyframes mslide{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mhdr h2{font-family:var(--fd);font-size:18px;font-weight:800}
.mcl{background:none;border:none;color:var(--mt);font-size:22px;cursor:pointer;padding:2px 6px;border-radius:8px;line-height:1}
#toast{position:fixed;top:-60px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;transition:top .3s ease;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.35);background:var(--ac);color:#fff}
#toast.err{background:var(--rd)}
.cgrid{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{padding:7px 11px;border-radius:10px;border:2px solid var(--bd);background:var(--s2);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--tx);font-family:var(--fn)}
.igrid{display:flex;flex-wrap:wrap;gap:6px}
.ibtn{width:38px;height:38px;border-radius:10px;border:2px solid var(--bd);background:var(--s3);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.ibtn.sel{border-color:var(--ac)}
.crow{display:flex;gap:7px;flex-wrap:wrap}
.clrbtn{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.lcrd{background:var(--s2);border-radius:15px;padding:15px;border-left:4px solid;margin-bottom:12px}
.div{height:1px;background:var(--bd);margin:12px 0}
.bignum{font-family:var(--fd);font-size:34px;font-weight:800;letter-spacing:-1px}
.grad{background:linear-gradient(135deg,#10B981,#38BDF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sec{padding:0 16px 16px}
.dglbl{padding:7px 16px 2px;font-size:11px;color:var(--mt);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.empty{text-align:center;padding:38px 20px;color:var(--mt)}
.ei{font-size:46px;opacity:.35;margin-bottom:10px}
.mi{display:flex;align-items:center;gap:13px;padding:13px 14px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;cursor:pointer;margin-bottom:8px;width:100%;text-align:left}
.mi:active{background:var(--s2)}
.mi-ic{width:42px;height:42px;border-radius:12px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mi-tx{flex:1}
.mi-t{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--tx)}
.mi-s{font-size:12px;color:var(--mt);margin-top:1px}
.sub{position:fixed;inset:0;background:var(--bg);z-index:90;overflow-y:auto;max-width:430px;margin:0 auto;padding-bottom:24px;animation:mslide .2s ease}
.sub::-webkit-scrollbar{width:0}
.shdr{display:flex;align-items:center;gap:12px;padding:18px 16px 12px;position:sticky;top:0;background:var(--bg);z-index:10}
.sbk{background:none;border:none;color:var(--ac);font-size:24px;cursor:pointer;padding:0 4px;line-height:1}
.rtab{padding:7px 14px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--fd);background:none;color:var(--mt)}
.rtab.on{background:var(--s2);color:var(--tx)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.bold{font-weight:700}
.muted{color:var(--mt)}
.sm{font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <button id="fab" onclick="openTxnModal()">＋</button>
  <nav id="nav">
    <button class="ni active" data-t="home" onclick="go('home')"><span class="ico">🏠</span>Home</button>
    <button class="ni" data-t="txns" onclick="go('txns')"><span class="ico">📋</span>Txns</button>
    <button class="ni" data-t="accs" onclick="go('accs')"><span class="ico">💳</span>Wallets</button>
    <button class="ni" data-t="rpts" onclick="go('rpts')"><span class="ico">📊</span>Reports</button>
    <button class="ni" data-t="more" onclick="go('more')"><span class="ico">⚙️</span>More</button>
  </nav>
</div>
<div id="mwrap"></div>
<div id="toast"></div>
<script>
// ═══ DATA ═══
const DEF={accounts:[{id:'a1',name:'Main Bank',type:'bank',currency:'USD',balance:4250,color:'#10B981',icon:'🏦'},{id:'a2',name:'Cash Wallet',type:'cash',currency:'USD',balance:320,color:'#F59E0B',icon:'💵'},{id:'a3',name:'Savings',type:'savings',currency:'USD',balance:12800,color:'#6366F1',icon:'🏧'},{id:'a4',name:'Investment',type:'investment',currency:'USD',balance:8640,color:'#F9A8D4',icon:'📈'}],categories:[{id:'c1',name:'Food & Dining',type:'expense',icon:'🍔',color:'#F87171'},{id:'c2',name:'Transport',type:'expense',icon:'🚗',color:'#FB923C'},{id:'c3',name:'Shopping',type:'expense',icon:'🛍️',color:'#A78BFA'},{id:'c4',name:'Health',type:'expense',icon:'💊',color:'#34D399'},{id:'c5',name:'Entertainment',type:'expense',icon:'🎬',color:'#60A5FA'},{id:'c6',name:'Housing',type:'expense',icon:'🏠',color:'#F59E0B'},{id:'c7',name:'Utilities',type:'expense',icon:'⚡',color:'#818CF8'},{id:'c8',name:'Salary',type:'income',icon:'💼',color:'#6EE7B7'},{id:'c9',name:'Freelance',type:'income',icon:'💻',color:'#67E8F9'},{id:'c10',name:'Investment Return',type:'income',icon:'📊',color:'#FCD34D'},{id:'c11',name:'Transfer',type:'transfer',icon:'↔️',color:'#CBD5E1'}],transactions:[{id:'t1',type:'income',amount:3500,accountId:'a1',categoryId:'c8',note:'Monthly salary',date:'2026-03-01'},{id:'t2',type:'expense',amount:85.5,accountId:'a1',categoryId:'c1',note:'Grocery store',date:'2026-03-02'},{id:'t3',type:'expense',amount:45,accountId:'a2',categoryId:'c2',note:'Fuel',date:'2026-03-03'},{id:'t4',type:'expense',amount:120,accountId:'a1',categoryId:'c3',note:'Clothes shopping',date:'2026-03-05'},{id:'t5',type:'income',amount:650,accountId:'a1',categoryId:'c9',note:'Web project',date:'2026-03-07'},{id:'t6',type:'expense',amount:30,accountId:'a2',categoryId:'c5',note:'Netflix + Spotify',date:'2026-03-08'},{id:'t7',type:'expense',amount:1200,accountId:'a1',categoryId:'c6',note:'Rent March',date:'2026-03-01'},{id:'t8',type:'expense',amount:95,accountId:'a1',categoryId:'c7',note:'Electricity bill',date:'2026-03-10'},{id:'t9',type:'income',amount:240,accountId:'a4',categoryId:'c10',note:'Dividend payout',date:'2026-03-12'},{id:'t10',type:'expense',amount:60,accountId:'a1',categoryId:'c4',note:'Pharmacy',date:'2026-03-13'}],loans:[{id:'l1',name:'Car Loan',type:'borrowed',totalAmount:15000,paidAmount:4500,interestRate:3.5,dueDate:'2028-06-01',lender:'City Bank',color:'#F87171'},{id:'l2',name:'Lent to Alex',type:'lent',totalAmount:800,paidAmount:200,interestRate:0,dueDate:'2026-08-01',lender:'Alex M.',color:'#6EE7B7'}],budgets:[{id:'b1',categoryId:'c1',amount:400},{id:'b2',categoryId:'c2',amount:200},{id:'b3',categoryId:'c3',amount:300},{id:'b4',categoryId:'c5',amount:100}],transfers:[{id:'tr1',fromAccountId:'a1',toAccountId:'a3',amount:500,date:'2026-03-05',note:'Monthly savings'}],settings:{currency:'USD',lastBackup:null}};
const KEY='walletpro_v3';let S={};
function load(){try{const d=localStorage.getItem(KEY);S=d?{...JSON.parse(JSON.stringify(DEF)),...JSON.parse(d)}:JSON.parse(JSON.stringify(DEF))}catch{S=JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}
const uid=()=>'_'+Math.random().toString(36).slice(2,9);
const fmt=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||S.settings?.currency||'USD',minimumFractionDigits:2}).format(n||0);
const today=()=>new Date().toISOString().slice(0,10);
const thisM=()=>new Date().toISOString().slice(0,7);
const getCat=id=>S.categories.find(c=>c.id===id)||{name:'Other',icon:'📦',color:'#64748B',type:'expense'};
const getAcc=id=>S.accounts.find(a=>a.id===id)||{name:'?',icon:'💳',color:'#64748B'};
const MNS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function toast(m,err=false){const t=document.getElementById('toast');t.textContent=m;t.className=err?'err':'';t.style.top='20px';clearTimeout(t._t);t._t=setTimeout(()=>t.style.top='-60px',2500)}
let tab='home',txnF='all',txnAF='all',txnQ='',rP='month',rT='expense';let importRows=[];
function go(t){tab=t;document.querySelectorAll('.ni').forEach(el=>el.classList.toggle('active',el.dataset.t===t));document.getElementById('fab').style.display=['home','txns'].includes(t)?'flex':'none';render()}
function render(){const c=document.getElementById('content');if(tab==='home')c.innerHTML=rHome();else if(tab==='txns')c.innerHTML=rTxns();else if(tab==='accs')c.innerHTML=rAccs();else if(tab==='rpts')c.innerHTML=rRpts();else if(tab==='more')c.innerHTML=rMore();setTimeout(()=>{if(tab==='home')iHomeChart();if(tab==='rpts'){iBarChart();iPieChart();}},60)}
function txnRow(t){const cat=getCat(t.categoryId),acc=getAcc(t.accountId);const ac=t.type==='income'?'ap':t.type==='expense'?'an':'at';const cc=t.type==='income'?'ci':t.type==='expense'?'ce':'ct';const pfx=t.type==='income'?'+':t.type==='expense'?'-':'↔';return`<div class="txi" onclick="openTxnModal('${t.id}')"><div class="txi-ic" style="background:${cat.color}22">${cat.icon}</div><div class="txi-m"><div class="txi-n">${t.note||cat.name}</div><div class="txi-s">${acc.icon} ${acc.name} · ${t.date}</div></div><div class="txi-a"><div class="${ac}">${pfx}${fmt(t.amount)}</div><span class="chip ${cc}" style="font-size:10px;margin-top:2px">${t.type}</span></div></div>`}
function rHome(){const total=S.accounts.reduce((s,a)=>s+a.balance,0);const mt=thisM();const mTx=S.transactions.filter(t=>t.date.startsWith(mt));const mI=mTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);const mE=mTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);const net=mI-mE;const recent=[...S.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);const budgets=S.budgets.slice(0,3).map(b=>{const cat=getCat(b.categoryId);const sp=S.transactions.filter(t=>t.categoryId===b.categoryId&&t.type==='expense'&&t.date.startsWith(mt)).reduce((s,t)=>s+t.amount,0);const pct=Math.min(100,(sp/b.amount)*100);const bc=pct>85?'var(--rd)':pct>65?'var(--a2)':'var(--ac)';return`<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between;margin-bottom:5px"><div class="row"><span style="font-size:17px">${cat.icon}</span><span style="font-size:13px;font-weight:600;margin-left:6px">${cat.name}</span></div><span class="sm muted">${fmt(sp)} / ${fmt(b.amount)}</span></div><div class="pb"><div class="pf" style="width:${pct}%;background:${bc}"></div></div></div>`}).join('');const accCards=S.accounts.map(a=>`<div class="acard" style="background:linear-gradient(135deg,${a.color}22,${a.color}0A);border:1px solid ${a.color}33" onclick="go('accs')"><div class="row" style="justify-content:space-between;margin-bottom:16px"><span style="font-size:22px">${a.icon}</span><span class="chip" style="background:${a.color}22;color:${a.color};font-size:10px">${a.type}</span></div><div class="sm muted" style="margin-bottom:3px">${a.name}</div><div style="font-family:var(--fd);font-size:20px;font-weight:800;color:${a.color}">${fmt(a.balance,a.currency)}</div></div>`).join('');return`<div class="hdr"><div class="row" style="justify-content:space-between;margin-bottom:14px"><div><div class="sm muted" style="margin-bottom:2px">Total Balance</div><div class="bignum grad">${fmt(total)}</div></div><div style="text-align:right"><div class="sm muted">${new Date().toLocaleString('default',{month:'long',year:'numeric'})}</div><button class="btn bo bsm" style="margin-top:8px" onclick="openTxnModal()">＋ Add</button></div></div><div class="srow"><div class="stat" style="border-top:2px solid var(--ac)"><div class="stl">↑ Income</div><div class="stv" style="color:var(--ac)">${fmt(mI)}</div></div><div class="stat" style="border-top:2px solid var(--rd)"><div class="stl">↓ Expense</div><div class="stv" style="color:var(--rd)">${fmt(mE)}</div></div><div class="stat" style="border-top:2px solid var(--a3)"><div class="stl">💰 Net</div><div class="stv" style="color:${net>=0?'var(--ac)':'var(--rd)'}">${fmt(net)}</div></div></div></div><div style="margin-top:14px"><div class="row" style="padding:0 16px;justify-content:space-between;margin-bottom:8px"><span class="stitle" style="margin:0">Accounts</span></div><div class="ascroll">${accCards}<div class="acard" style="background:var(--s2);border:1px dashed var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:105px" onclick="openAccModal()"><span style="font-size:26px;color:var(--ac)">＋</span><span class="sm muted" style="margin-top:5px">New</span></div></div></div><div class="sec" style="margin-top:16px"><div class="stitle">Budgets This Month</div>${budgets||`<div class="muted sm">No budgets. <span style="color:var(--ac);cursor:pointer" onclick="openBudgetModal()">Add one →</span></div>`}<button class="btn bo bsm bfull" style="margin-top:8px" onclick="openBudgetModal()">Manage Budgets</button></div><div class="sec"><div class="stitle">Spending Trend</div><div class="card"><canvas id="hchart" height="130"></canvas></div></div><div class="sec"><div class="stitle">Recent Transactions</div>${recent.length?recent.map(t=>txnRow(t)).join(''):'<div class="empty"><div class="ei">📭</div>No transactions yet. Tap ＋ to add one.</div>'}</div>`}

function _buildTxnForm(tx,tp,prefAcc){const cats=S.categories.filter(c=>c.type===tp);const selCat=tx?.categoryId||cats[0]?.id||'';const accOpts=S.accounts.map(a=>`<option value="${a.id}" ${(tx?.accountId||prefAcc)===a.id?'selected':''}>${a.icon} ${a.name} (${fmt(a.balance)})</option>`).join('');const catBtns=cats.map(c=>`<button class="cbtn" data-id="${c.id}" data-col="${c.color}" onclick="selCat(this)" style="border-color:${selCat===c.id?c.color:'var(--bd)'};background:${selCat===c.id?c.color+'22':'var(--s2)'}">${c.icon} ${c.name}</button>`).join('');openModal(`<div class="mhdr"><h2>${tx?'Edit':'New'} Transaction</h2><button class="mcl" onclick="closeModal()">✕</button></div><div class="ttog"><button class="tb ti ${tp==='income'?'on':''}" onclick="switchTxnType('income')">Income</button><button class="tb te ${tp==='expense'?'on':''}" onclick="switchTxnType('expense')">Expense</button><button class="tb tt ${tp==='transfer'?'on':''}" onclick="switchTxnType('transfer')">Transfer</button></div><input type="hidden" id="_tp" value="${tp}"><input type="hidden" id="_cat" value="${selCat}"><input type="hidden" id="_id" value="${tx?.id||''}"><div class="fg"><label class="lbl">Amount</label><input type="number" id="_amt" value="${tx?.amount||''}" placeholder="0.00" style="font-size:22px;font-weight:700;font-family:var(--fd)"></div><div class="r2"><div class="fg"><label class="lbl">Account</label><select id="_acc">${accOpts}</select></div><div class="fg"><label class="lbl">Date</label><input type="date" id="_dt" value="${tx?.date||today()}"></div></div><div class="fg"><label class="lbl">Category</label><div class="cgrid" id="_cg">${catBtns}</div></div><div class="fg"><label class="lbl">Note</label><input type="text" id="_nt" value="${tx?.note||''}" placeholder="What was this for?"></div><div style="display:flex;gap:8px"><button class="btn bp bfull" onclick="saveTxn()">${tx?'Update':'Save'} Transaction</button>${tx?`<button class="btn bd2" onclick="delTxn('${tx.id}')">🗑️</button>`:''}</div>`)}

function saveTxn(){const id=document.getElementById('_id')?.value;const tp=document.getElementById('_tp')?.value;const amt=parseFloat(document.getElementById('_amt')?.value);const accId=document.getElementById('_acc')?.value;const catId=document.getElementById('_cat')?.value;const note=document.getElementById('_nt')?.value||'';const date=document.getElementById('_dt')?.value||today();if(!amt||amt<=0){toast('Enter a valid amount',true);return}if(!accId){toast('Select an account',true);return}let txns=[...S.transactions];let accs=S.accounts.map(a=>({...a}));if(id){const old=txns.find(t=>t.id===id);if(old){const ai=accs.findIndex(a=>a.id===old.accountId);if(ai!==-1){if(old.type==='income')accs[ai].balance-=old.amount;if(old.type==='expense')accs[ai].balance+=old.amount}}txns=txns.map(t=>t.id===id?{...t,type:tp,amount:amt,accountId:accId,categoryId:catId,note,date}:t)}else{txns.push({id:uid(),type:tp,amount:amt,accountId:accId,categoryId:catId,note,date})}const ai=accs.findIndex(a=>a.id===accId);if(ai!==-1){if(tp==='income')accs[ai].balance+=amt;if(tp==='expense')accs[ai].balance-=amt}S.transactions=txns;S.accounts=accs;save();closeModal();render();toast(id?'Transaction updated!':'Transaction added!')}
function delTxn(id){if(!confirm('Delete this transaction?'))return;const t=S.transactions.find(x=>x.id===id);if(t){const ai=S.accounts.findIndex(a=>a.id===t.accountId);if(ai!==-1){if(t.type==='income')S.accounts[ai].balance-=t.amount;if(t.type==='expense')S.accounts[ai].balance+=t.amount}}S.transactions=S.transactions.filter(x=>x.id!==id);save();closeModal();render();toast('Deleted')}
const AICONS=['🏦','💵','💳','🏧','📈','💰','🏠','🚀','💎','🌍','🎯','💹'];
const COLS=['#10B981','#F59E0B','#6366F1','#EF4444','#3B82F6','#F9A8D4','#93C5FD','#FCD34D','#6EE7B7','#FB923C'];
function openAccModal(id){const a=id?S.accounts.find(x=>x.id===id):null;const si=a?.icon||'🏦',sc=a?.color||'#10B981';openModal(`<div class="mhdr"><h2>${a?'Edit':'New'} Account</h2><button class="mcl" onclick="closeModal()">✕</button></div><div class="fg"><label class="lbl">Account Name</label><input id="_an" value="${a?.name||''}" placeholder="e.g. Main Bank"></div><div class="r2"><div class="fg"><label class="lbl">Type</label><select id="_at">${['bank','cash','savings','investment','credit','other'].map(t=>`<option value="${t}" ${a?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="fg"><label class="lbl">Currency</label><select id="_ac2">${['USD','EUR','GBP','JPY','CAD','AUD','INR','BRL','MXN','CHF','PKR','AED','SAR'].map(c=>`<option value="${c}" ${a?.currency===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="fg"><label class="lbl">Balance</label><input type="number" id="_ab" value="${a?.balance||'0'}"></div><div class="fg"><label class="lbl">Icon</label><div class="igrid">${AICONS.map(ic=>`<button class="ibtn ${si===ic?'sel':''}" onclick="pickIcon(this,'_ai')">${ic}</button>`).join('')}</div><input type="hidden" id="_ai" value="${si}"></div><div class="fg"><label class="lbl">Color</label><div class="crow">${COLS.map(c=>`<button class="clrbtn" style="background:${c};border-color:${sc===c?'white':'transparent'}" onclick="pickColor(this,'_acl','${c}')"></button>`).join('')}</div><input type="hidden" id="_acl" value="${sc}"></div><button class="btn bp bfull" onclick="saveAcc('${a?.id||''}')">${a?'Update':'Add'} Account</button>`)}
function pickIcon(btn,field){document.getElementById(field).value=btn.textContent;btn.closest('.igrid').querySelectorAll('.ibtn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel')}
function pickColor(btn,field,c){document.getElementById(field).value=c;btn.closest('.crow').querySelectorAll('.clrbtn').forEach(b=>b.style.borderColor='transparent');btn.style.borderColor='white'}
function saveAcc(id){const name=(document.getElementById('_an')?.value||'').trim();if(!name){toast('Enter account name',true);return}const acc={name,type:document.getElementById('_at')?.value,currency:document.getElementById('_ac2')?.value,balance:parseFloat(document.getElementById('_ab')?.value)||0,icon:document.getElementById('_ai')?.value||'🏦',color:document.getElementById('_acl')?.value||'#10B981'};if(id)S.accounts=S.accounts.map(a=>a.id===id?{...a,...acc}:a);else S.accounts.push({id:uid(),...acc});save();closeModal();render();toast(id?'Account updated!':'Account added!')}
function openTransferModal(){const opts=S.accounts.map(a=>`<option value="${a.id}">${a.icon} ${a.name} (${fmt(a.balance)})</option>`).join('');openModal(`<div class="mhdr"><h2>New Transfer</h2><button class="mcl" onclick="closeModal()">✕</button></div><div class="fg"><label class="lbl">From Account</label><select id="_tf">${opts}</select></div><div style="text-align:center;font-size:24px;color:var(--ac);margin:-4px 0 8px">↓</div><div class="fg"><label class="lbl">To Account</label><select id="_tt">${opts}</select></div><div class="r2"><div class="fg"><label class="lbl">Amount</label><input type="number" id="_ta" placeholder="0.00"></div><div class="fg"><label class="lbl">Date</label><input type="date" id="_td" value="${today()}"></div></div><div class="fg"><label class="lbl">Note</label><input id="_tn" placeholder="e.g. Monthly savings"></div><button class="btn bp bfull" onclick="saveTransfer()">Complete Transfer ↔</button>`)}
function saveTransfer(){const fId=document.getElementById('_tf')?.value,tId=document.getElementById('_tt')?.value;const amt=parseFloat(document.getElementById('_ta')?.value);if(!amt||amt<=0){toast('Enter valid amount',true);return}if(fId===tId){toast('Choose different accounts',true);return}S.accounts=S.accounts.map(a=>{if(a.id===fId)return{...a,balance:a.balance-amt};if(a.id===tId)return{...a,balance:a.balance+amt};return a});S.transfers.push({id:uid(),fromAccountId:fId,toAccountId:tId,amount:amt,date:document.getElementById('_td')?.value||today(),note:document.getElementById('_tn')?.value||''});save();closeModal();render();toast('Transfer completed!')}
function openBudgetModal(){const rows=S.budgets.map(b=>{const cat=getCat(b.categoryId);return`<div class="row" style="margin-bottom:10px;gap:8px"><span style="font-size:18px">${cat.icon}</span><span style="flex:1;font-size:13px">${cat.name}</span><input type="number" value="${b.amount}" id="ba-${b.id}" style="width:90px"><button onclick="remBudget('${b.id}')" style="background:none;border:none;color:var(--rd);cursor:pointer;font-size:18px;padding:0 2px">✕</button></div>`}).join('');const unused=S.categories.filter(c=>c.type==='expense'&&!S.budgets.find(b=>b.categoryId===c.id));openModal(`<div class="mhdr"><h2>Manage Budgets</h2><button class="mcl" onclick="closeModal()">✕</button></div><div id="_brows">${rows||'<div class="muted sm" style="margin-bottom:12px">No budgets set.</div>'}</div><div class="div"></div><div style="display:flex;gap:8px;margin-top:8px"><select id="_bcat" style="flex:1"><option value="">Pick category…</option>${unused.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select><input type="number" id="_bamt" placeholder="Limit" style="width:88px"><button class="btn bp" style="padding:10px 13px" onclick="addBudget()">＋</button></div><button class="btn bp bfull" style="margin-top:13px" onclick="saveBudgets()">Save Budgets</button>`)}
function addBudget(){const cId=document.getElementById('_bcat')?.value,amt=parseFloat(document.getElementById('_bamt')?.value);if(!cId||!amt){toast('Fill both fields',true);return}S.budgets.push({id:uid(),categoryId:cId,amount:amt});save();openBudgetModal();toast('Budget added')}
function remBudget(id){S.budgets=S.budgets.filter(b=>b.id!==id);save();openBudgetModal()}
function saveBudgets(){S.budgets.forEach(b=>{const el=document.getElementById('ba-'+b.id);if(el)b.amount=parseFloat(el.value)||b.amount});save();closeModal();render();toast('Budgets saved!')}
function openLoanSub(){const owed=S.loans.filter(l=>l.type==='borrowed').reduce((s,l)=>s+(l.totalAmount-l.paidAmount),0);const lent=S.loans.filter(l=>l.type==='lent').reduce((s,l)=>s+(l.totalAmount-l.paidAmount),0);const cards=S.loans.map(l=>{const rem=l.totalAmount-l.paidAmount,pct=Math.min(100,(l.paidAmount/l.totalAmount)*100);return`<div class="lcrd" style="border-color:${l.color}"><div class="row" style="align-items:flex-start;margin-bottom:9px"><div style="flex:1"><div style="font-family:var(--fd);font-size:15px;font-weight:700">${l.name}</div><div class="sm muted">${l.lender} · Due ${l.dueDate}</div>${l.interestRate>0?`<div class="sm" style="color:var(--a2)">Interest: ${l.interestRate}%</div>`:''}</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="chip ${l.type==='borrowed'?'ce':'ci'}">${l.type==='borrowed'?'I Owe':'Owed to Me'}</span><button onclick="delLoan('${l.id}')" style="background:none;border:none;color:var(--mt);cursor:pointer;font-size:12px">✕ Remove</button></div></div><div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:8px"><span class="muted">Paid: <span style="color:var(--ac);font-weight:700">${fmt(l.paidAmount)}</span></span><span class="muted">Left: <span style="color:${l.color};font-weight:700">${fmt(rem)}</span></span></div><div class="pb"><div class="pf" style="width:${pct}%;background:${l.color}"></div></div><div class="sm muted" style="text-align:right;margin-top:5px">${Math.round(pct)}% paid</div></div>`}).join('');const sub=document.createElement('div');sub.className='sub';sub.id='_lsub';sub.innerHTML=`<div class="shdr"><button class="sbk" onclick="closeSub('_lsub')">‹</button><h1 style="font-family:var(--fd);font-size:20px;font-weight:800">Loans & Debts</h1><div class="sp"></div><button class="btn bp bsm" onclick="openLoanModal()">＋</button></div><div style="display:flex;gap:10px;padding:0 16px;margin-bottom:14px"><div class="stat" style="border-top:2px solid var(--rd)"><div class="stl">I Owe</div><div class="stv" style="color:var(--rd)">${fmt(owed)}</div></div><div class="stat" style="border-top:2px solid var(--ac)"><div class="stl">Owed to Me</div><div class="stv" style="color:var(--ac)">${fmt(lent)}</div></div></div><div class="sec">${cards||'<div class="empty"><div class="ei">📋</div>No loans recorded</div>'}</div>`;document.getElementById('app').appendChild(sub)}
function closeSub(id){const el=document.getElementById(id);if(el)el.remove()}
function delLoan(id){S.loans=S.loans.filter(l=>l.id!==id);save();closeSub('_lsub');openLoanSub();toast('Removed')}
function openLoanModal(){openModal(`<div class="mhdr"><h2>Add Loan / Debt</h2><button class="mcl" onclick="closeModal()">✕</button></div><div class="ttog"><button class="tb te on" id="_lt-b" onclick="setLT('borrowed')">I Borrowed</button><button class="tb ti" id="_lt-l" onclick="setLT('lent')">I Lent</button></div><input type="hidden" id="_lt" value="borrowed"><div class="fg"><label class="lbl">Loan Name</label><input id="_ln" placeholder="e.g. Car Loan"></div><div class="fg"><label class="lbl">Lender / Borrower</label><input id="_ll" placeholder="Name or institution"></div><div class="r2"><div class="fg"><label class="lbl">Total Amount</label><input type="number" id="_lamt"></div><div class="fg"><label class="lbl">Already Paid</label><input type="number" id="_lpd" value="0"></div></div><div class="r2"><div class="fg"><label class="lbl">Interest Rate %</label><input type="number" id="_lr" value="0"></div><div class="fg"><label class="lbl">Due Date</label><input type="date" id="_ld"></div></div><button class="btn bp bfull" onclick="saveLoan()">Add Loan</button>`)}
function setLT(t){document.getElementById('_lt').value=t;document.getElementById('_lt-b').className=`tb te${t==='borrowed'?' on':''}`;document.getElementById('_lt-l').className=`tb ti${t==='lent'?' on':''}`}
function saveLoan(){const name=(document.getElementById('_ln')?.value||'').trim();const total=parseFloat(document.getElementById('_lamt')?.value);if(!name||!total){toast('Fill required fields',true);return}const tp=document.getElementById('_lt')?.value;S.loans.push({id:uid(),name,type:tp,totalAmount:total,paidAmount:parseFloat(document.getElementById('_lpd')?.value)||0,interestRate:parseFloat(document.getElementById('_lr')?.value)||0,dueDate:document.getElementById('_ld')?.value||'',lender:document.getElementById('_ll')?.value||'',color:tp==='borrowed'?'#EF4444':'#10B981'});save();closeModal();closeSub('_lsub');openLoanSub();toast('Loan added!')}
const ALLICONS=['🍔','🚗','🛍️','💊','🎬','🏠','⚡','💼','💻','📊','✈️','🎓','🎁','🐾','🏋️','☕','🍺','🎮','🏥','💰','📱','🔧','🌱','🎵','🏖️','📚'];
let catFilter='all';
function openCatSub(){const sub=document.createElement('div');sub.className='sub';sub.id='_csub';sub.innerHTML=`<div class="shdr"><button class="sbk" onclick="closeSub('_csub')">‹</button><h1 style="font-family:var(--fd);font-size:20px;font-weight:800">Categories</h1><div class="sp"></div><button class="btn bp bsm" onclick="toggleCatForm()">＋</button></div><div id="_cadd" style="display:none;padding:0 16px 14px"><div class="card" style="border:1px solid rgba(16,185,129,.3)"><div class="fg"><label class="lbl">Name</label><input id="_cnm" placeholder="Category name"></div><div class="fg"><label class="lbl">Type</label><div class="ttog"><button class="tb ti" id="ctt-i" onclick="setCatT('income')">Income</button><button class="tb te on" id="ctt-e" onclick="setCatT('expense')">Expense</button><button class="tb tt" id="ctt-t" onclick="setCatT('transfer')">Transfer</button></div><input type="hidden" id="_ctp" value="expense"></div><div class="fg"><label class="lbl">Icon</label><div class="igrid">${ALLICONS.map(ic=>`<button class="ibtn" onclick="this.closest('.igrid').querySelectorAll('.ibtn').forEach(b=>b.classList.remove('sel'));this.classList.add('sel');document.getElementById('_cion').value=this.textContent">${ic}</button>`).join('')}</div><input type="hidden" id="_cion" value="🏷️"></div><div class="fg"><label class="lbl">Color</label><div class="crow">${COLS.map(c=>`<button class="clrbtn" style="background:${c}" onclick="this.closest('.crow').querySelectorAll('.clrbtn').forEach(b=>b.style.borderColor='transparent');this.style.borderColor='white';document.getElementById('_ccol').value='${c}'"></button>`).join('')}</div><input type="hidden" id="_ccol" value="#10B981"></div><div style="display:flex;gap:8px"><button class="btn bp bfull" onclick="saveCat()">Save</button><button class="btn bo" onclick="toggleCatForm()">Cancel</button></div></div></div><div class="frow" style="padding:0 16px;margin-bottom:12px"><button class="fc on" id="cf-all" onclick="setCatF('all')">All</button><button class="fc" id="cf-income" onclick="setCatF('income')">Income</button><button class="fc" id="cf-expense" onclick="setCatF('expense')">Expense</button><button class="fc" id="cf-transfer" onclick="setCatF('transfer')">Transfer</button></div><div class="sec" id="_clist">${renderCatList('all')}</div>`;document.getElementById('app').appendChild(sub)}
function renderCatList(f){const cats=f==='all'?S.categories:S.categories.filter(c=>c.type===f);if(!cats.length)return'<div class="empty"><div class="ei">🏷️</div>No categories</div>';return cats.map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s1);margin-bottom:6px;border-left:3px solid ${c.color}"><div style="width:36px;height:36px;border-radius:9px;background:${c.color}22;display:flex;align-items:center;justify-content:center;font-size:18px">${c.icon}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${c.name}</div><span class="chip ${c.type==='income'?'ci':c.type==='expense'?'ce':'ct'}" style="font-size:10px">${c.type}</span></div><button onclick="delCat('${c.id}')" style="background:none;border:none;color:var(--mt);cursor:pointer;font-size:18px;padding:0 3px">✕</button></div>`).join('')}
function setCatF(f){catFilter=f;['all','income','expense','transfer'].forEach(x=>document.getElementById('cf-'+x)?.classList.toggle('on',x===f));const el=document.getElementById('_clist');if(el)el.innerHTML=renderCatList(f)}
function toggleCatForm(){const f=document.getElementById('_cadd');if(f)f.style.display=f.style.display==='none'?'block':'none'}
function setCatT(t){document.getElementById('_ctp').value=t;['i','e','t'].forEach(x=>{const el=document.getElementById('ctt-'+x);if(el){el.classList.remove('on');if((t==='income'&&x==='i')||(t==='expense'&&x==='e')||(t==='transfer'&&x==='t'))el.classList.add('on')}})}
function saveCat(){const name=(document.getElementById('_cnm')?.value||'').trim();if(!name){toast('Enter name',true);return}S.categories.push({id:uid(),name,type:document.getElementById('_ctp')?.value||'expense',icon:document.getElementById('_cion')?.value||'🏷️',color:document.getElementById('_ccol')?.value||'#10B981'});save();const el=document.getElementById('_clist');if(el)el.innerHTML=renderCatList(catFilter);toggleCatForm();toast('Category added!')}
function delCat(id){S.categories=S.categories.filter(c=>c.id!==id);save();const el=document.getElementById('_clist');if(el)el.innerHTML=renderCatList(catFilter);toast('Deleted')}
function openCoaSub(){const groups=[{title:'ASSETS',items:S.accounts},{title:'INCOME CATEGORIES',items:S.categories.filter(c=>c.type==='income')},{title:'EXPENSE CATEGORIES',items:S.categories.filter(c=>c.type==='expense')},{title:'LIABILITIES / LOANS',items:S.loans}];const renderG=({title,items})=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;margin-top:8px"><div style="flex:1;height:1px;background:var(--bd)"></div><span style="font-family:var(--fd);font-size:11px;font-weight:700;color:var(--ac);letter-spacing:1px">${title}</span><div style="flex:1;height:1px;background:var(--bd)"></div></div>${items.length?items.map(item=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:var(--s1);margin-bottom:5px"><div style="width:34px;height:34px;border-radius:9px;background:${(item.color||'#64748B')}22;display:flex;align-items:center;justify-content:center;font-size:16px">${item.icon||'📦'}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${item.name}</div><div class="sm muted" style="text-transform:capitalize">${item.type||''}</div></div>${item.balance!==undefined?`<div style="font-weight:700;font-size:13px;color:${item.color}">${fmt(item.balance)}</div>`:''}${item.totalAmount!==undefined?`<div style="font-weight:700;font-size:13px;color:${item.color}">${fmt(item.totalAmount-item.paidAmount)}</div>`:''}</div>`).join(''):'<div class="sm muted" style="padding:6px 0 10px">None</div>'}`;const sub=document.createElement('div');sub.className='sub';sub.id='_coa';sub.innerHTML=`<div class="shdr"><button class="sbk" onclick="closeSub('_coa')">‹</button><h1 style="font-family:var(--fd);font-size:20px;font-weight:800">Chart of Accounts</h1></div><div class="sec">${groups.map(renderG).join('')}</div>`;document.getElementById('app').appendChild(sub)}
function openImportModal(){importRows=[];openModal(`<div class="mhdr"><h2>📥 Import Data</h2><button class="mcl" onclick="closeModal()">✕</button></div><p class="sm muted" style="margin-bottom:14px">Import from Wallet by Budget Baker CSV or WalletPro JSON backup file.</p><div style="background:var(--s2);border:2px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;margin-bottom:14px"><div style="font-size:40px;margin-bottom:8px">📁</div><div class="sm muted" style="margin-bottom:12px">Tap to select CSV or JSON file</div><input type="file" accept=".csv,.json" onchange="handleImport(event)" style="font-size:13px;color:var(--tx)"></div><div id="_iprev"></div>`)}
function handleImport(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const content=ev.target.result;if(file.name.endsWith('.json')){try{const d=JSON.parse(content);if(d.transactions){S={...S,...d};save();closeModal();render();toast('Data restored!');return}toast('Invalid JSON',true)}catch{toast('Failed to parse',true)}return}const lines=content.split('\n').filter(l=>l.trim());importRows=lines.slice(1).map(l=>{const p=l.split(',');return{date:(p[0]||'').trim().slice(0,10),type:(['income','expense','transfer'].includes((p[1]||'').trim().toLowerCase())?(p[1]||'').trim().toLowerCase():'expense'),amount:Math.abs(parseFloat(p[2]||0)),note:(p[4]||p[3]||'').trim().slice(0,60)}}).filter(r=>r.date&&r.amount>0);const prev=document.getElementById('_iprev');if(prev)prev.innerHTML=`<div style="font-family:var(--fd);font-size:14px;font-weight:700;margin:12px 0 8px">Preview — ${importRows.length} rows</div>${importRows.slice(0,4).map(r=>`<div class="card2" style="margin-bottom:5px;font-size:12px"><span style="color:var(--ac)">${r.date}</span> · ${r.type} · <strong>${fmt(r.amount)}</strong>${r.note?' · '+r.note:''}</div>`).join('')}${importRows.length>4?`<div class="sm muted">…and ${importRows.length-4} more</div>`:''}<button class="btn bp bfull" style="margin-top:12px" onclick="doImport()">Import All ${importRows.length} Transactions →</button>`};r.readAsText(file)}
function doImport(){const newT=importRows.map(r=>({id:uid(),type:r.type,amount:r.amount,accountId:S.accounts[0]?.id||'',categoryId:S.categories.find(c=>c.type===r.type)?.id||S.categories[0]?.id||'',note:r.note,date:r.date}));S.transactions=[...S.transactions,...newT];save();closeModal();render();toast(`Imported ${newT.length} transactions!`)}
function openBackupModal(){openModal(`<div class="mhdr"><h2>💾 Backup & Restore</h2><button class="mcl" onclick="closeModal()">✕</button></div><p class="sm muted" style="margin-bottom:14px">🔒 All your data is stored 100% locally on THIS device only. Nothing is sent to any server.</p><div class="card2" style="margin-bottom:14px"><div style="font-size:13px;font-weight:600;margin-bottom:5px">📊 Your Data Summary</div><div class="sm muted">${S.transactions.length} transactions · ${S.accounts.length} accounts · ${S.categories.length} categories · ${S.loans.length} loans</div></div><button class="btn bp bfull" style="margin-bottom:10px" onclick="doBackup()">📤 Export Backup File (.json)</button><div style="height:1px;background:var(--bd);margin:10px 0"></div><div class="fg" style="margin-top:10px"><label class="lbl">📥 Restore from backup file</label><input type="file" accept=".json" onchange="handleImport(event)" style="font-size:13px;color:var(--tx)"></div>`)}
function doBackup(){S.settings.lastBackup=new Date().toISOString();save();const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`walletpro_backup_${today()}.json`;a.click();URL.revokeObjectURL(url);toast('Backup file saved!')}
function openSettingsModal(){openModal(`<div class="mhdr"><h2>⚙️ Settings</h2><button class="mcl" onclick="closeModal()">✕</button></div><div class="fg"><label class="lbl">Default Currency</label><select id="_sc">${['USD','EUR','GBP','JPY','CAD','AUD','CHF','INR','BRL','MXN','PKR','AED','SAR','TRY','NGN'].map(c=>`<option value="${c}" ${S.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn bp bfull" style="margin-bottom:10px" onclick="saveSettings()">Save Settings</button><div style="height:1px;background:var(--bd);margin:12px 0"></div><button class="btn bo bfull" style="margin-bottom:10px" onclick="doBackup()">📤 Export Backup</button><button class="btn bd2 bfull" onclick="clearAll()">🗑️ Clear All Data</button>`)}
function saveSettings(){S.settings.currency=document.getElementById('_sc')?.value||'USD';save();closeModal();render();toast('Settings saved!')}
function clearAll(){if(!confirm('Delete ALL data? This cannot be undone!'))return;S=JSON.parse(JSON.stringify(DEF));save();closeModal();render();toast('All data cleared')}
load();go('home');
</script>
</body>
</html>
